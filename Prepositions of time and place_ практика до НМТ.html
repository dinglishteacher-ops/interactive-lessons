<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prepositions of time and place: практика до НМТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FB;--card:#FFFFFF;--ink:#1F2A44;--muted:#5B6680;--line:#E1E6EF;--chip:#EEF1F6;
  --at:#0E8C7F;--on:#B07800;--in:#6C4AB6;--ok:#15803D;--okbg:#E7F6EC;--bad:#C2410C;--badbg:#FDEDE4;--sel:#1F2A44;--seltext:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121724;--card:#1B2233;--ink:#E7ECF5;--muted:#9AA5BD;--line:#2C3549;--chip:#252E42;
  --at:#3CC2B3;--on:#F0B429;--in:#A98BF0;--ok:#4ADE80;--okbg:#173524;--bad:#FB8A5B;--badbg:#3A2218;--sel:#E7ECF5;--seltext:#121724;}}
:root[data-theme="dark"]{
  --bg:#121724;--card:#1B2233;--ink:#E7ECF5;--muted:#9AA5BD;--line:#2C3549;--chip:#252E42;
  --at:#3CC2B3;--on:#F0B429;--in:#A98BF0;--ok:#4ADE80;--okbg:#173524;--bad:#FB8A5B;--badbg:#3A2218;--sel:#E7ECF5;--seltext:#121724;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Poppins','DejaVu Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header h1{font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:700;letter-spacing:-1px}
header p{font-family:'Lora',Georgia,serif;font-style:italic;color:var(--muted);font-size:18px;margin-top:10px}
.legend{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.legend span{font-weight:700;padding:3px 12px;border-radius:7px;background:var(--chip)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);gap:12px}
.bar b{color:var(--ink)}
.track{height:6px;background:var(--chip);border-radius:6px;margin-top:8px;overflow:hidden}
.track div{height:100%;width:0;background:var(--in);transition:width .25s}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 11px;font-size:14px;font-weight:600}
nav a.done{border-color:var(--ok);color:var(--ok)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin-top:18px}
.eh{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.num{flex:none;width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.eh h2{font-size:19px;line-height:1.35;font-weight:600;padding-top:6px}
.eh h2 small{display:block;font-family:'Lora',Georgia,serif;font-style:italic;font-weight:400;font-size:15px;color:var(--muted);margin-top:2px}
.item{padding:14px 0;border-bottom:1px dashed var(--line)}
.item:last-of-type{border-bottom:none}
.sent{font-size:18px;line-height:1.55}
.sent .n{font-weight:700;color:var(--muted);margin-right:6px}
.gap{display:inline-block;min-width:64px;padding:0 6px;border-bottom:2px solid var(--ink);text-align:center;font-weight:700;color:var(--in);line-height:1.3}
.gap.ok{color:var(--ok);border-color:var(--ok)}.gap.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{font:inherit;font-size:16px;font-weight:600;min-height:42px;min-width:52px;padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.opts button .l{color:var(--muted);font-weight:700;margin-right:5px}
.opts button.sel{background:var(--sel);color:var(--seltext);border-color:var(--sel)}
.opts button.sel .l{color:inherit}
.opts button.right{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.opts button.wrong{background:var(--badbg);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.opts button:disabled{cursor:default}
.opts button:focus-visible,.btn:focus-visible,nav a:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.fb{font-size:15px;margin-top:8px;font-family:'Lora',Georgia,serif;display:none}
.fb.show{display:block}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.crow{display:flex;align-items:center;gap:10px}.crow .n{font-weight:700;color:var(--muted);min-width:26px;font-size:17px}.crow .opts{margin-top:0}
.sub2{font-size:14px;color:var(--muted);margin:10px 0 0}
.text{font-family:'Lora',Georgia,serif;font-size:18px;line-height:1.9;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0 6px}
.text sup{font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;margin-right:2px}
.text .gap{min-width:58px;font-family:'Poppins',sans-serif;font-size:16px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:46px;padding:10px 20px;border-radius:12px;border:none;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.score{font-weight:700;font-size:17px}
.final{text-align:center}
.final .big{font-size:56px;font-weight:700;line-height:1;margin:6px 0}
.final p{color:var(--muted);font-family:'Lora',Georgia,serif}
@media (max-width:480px){.sent{font-size:17px}.opts button{font-size:15px;padding:6px 12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Prepositions of time and place</h1>
  <p>Практика до НМТ: обирай відповідь, потім тисни «Перевірити».</p>
  <div class="legend"><span style="color:var(--at)">at</span><span style="color:var(--on)">on</span><span style="color:var(--in)">in</span></div>
</header>
<div class="bar">
  <div class="row"><span>Відповіді: <b id="answered">0</b> з <b id="total">0</b></span><span id="tot"></span></div>
  <div class="track"><div id="prog"></div></div>
  <nav id="nav"></nav>
</div>
<main id="app"></main>
<section class="final" id="final">
  <div class="eh" style="justify-content:center"><h2>Загальний результат</h2></div>
  <div class="big" id="fscore">–</div>
  <p id="fmsg">Перевір усі вправи, щоб побачити результат.</p>
  <div class="actions" style="justify-content:center"><button class="btn ghost" id="resetAll">Почати спочатку</button></div>
</section>
</div>
<script>
const EX=[
{id:'e1',title:'Complete with at, on, in or – (no preposition).',note:'Prepositions of time',type:'gap',opts:['at','on','in','–'],items:[
["My English lesson starts ___ eleven o'clock.","at"],
["We usually have a school concert ___ Teachers' Day.","on"],
["I was born ___ 2011.","in"],
["Let's meet ___ lunchtime near the canteen.","at"],
["The shop is closed ___ Sunday mornings.","on"],
["Wait for me, I'll be ready ___ three minutes' time.","in"],
["We're going to Lviv ___ next Saturday.","–","next / last / this / every: без прийменника"],
["It's very cold here ___ winter.","in"],
["___ that time, I didn't speak any English.","at"],
["Our exam is ___ 6 May.","on"],
["I'm busy ___ the moment. Can I call you back?","at"],
["They moved to Kyiv ___ last September.","–","last September: без прийменника"],
["What are you doing ___ the weekend?","at","BrE: at the weekend"],
["The bus always arrives ___ time.","on","on time = вчасно, за розкладом"]]},
{id:'e2',title:'Complete with at, on or in.',note:'Prepositions of place',type:'gap',opts:['at','on','in'],items:[
["Anna is ___ school now, she's got a maths test.","at","at school = на заняттях"],
["The keys are ___ the table next to the lamp.","on"],
["Can you find Poltava ___ the map?","on"],
["When it rains, our PE lessons are ___ the gym.","in"],
["The kids are playing football ___ the playground.","in"],
["Turn left and the pharmacy is ___ the right.","on"],
["Who is the girl ___ the picture?","in"],
["I sit ___ the back of the classroom, so I can't see the board well.","at"],
["We met ___ the party at Max's house.","at"],
["My cat loves sleeping ___ the floor.","on"],
["My uncle lives ___ 12 Shevchenko Street.","at","адреса з номером будинку: at"],
["There are lots of cafés ___ the city centre.","in"],
["I'll wait for you ___ the station.","at"],
["It's 11 a.m. and my brother is still ___ bed.","in"]]},
{id:'e3',title:'Find the mistake.',note:'Якщо помилки немає, обери «Без помилки». Два речення правильні.',type:'fix',items:[
["I'll see you in Monday morning.",["Без помилки","at Monday morning","on Monday morning"],"on Monday morning","з конкретним днем завжди on"],
["We got on the taxi and went home.",["Без помилки","got into the taxi","got at the taxi"],"got into the taxi","taxi, car: get in / into"],
["She arrived to London late at night.",["Без помилки","arrived in London","arrived on London"],"arrived in London","arrive in + місто, ніколи arrive to"],
["I usually do my homework at the evening.",["Без помилки","on the evening","in the evening"],"in the evening","in the morning / afternoon / evening"],
["Let's meet on next Friday.",["Без помилки","meet next Friday","meet in next Friday"],"meet next Friday","next: без прийменника"],
["The main character on the book is a teenager.",["Без помилки","in the book","at the book"],"in the book","in the book, але on page 5"],
["I'll be back at ten minutes' time.",["Без помилки","on ten minutes' time","in ten minutes' time"],"in ten minutes' time","in … time = через"],
["Sit at the front if you can't see the board.",["Без помилки","in the front","on the front"],"Без помилки","at the front = попереду"],
["We always go skiing on winter.",["Без помилки","in winter","at winter"],"in winter","пори року: in"],
["There's a bus stop in front of our school.",["Без помилки","at front of","on front of"],"Без помилки","in front of = перед"]]},
{id:'e4',title:'Complete with for, since, during, by, until or from … to.',note:'Кожен варіант один раз.',type:'gap',opts:['for','since','during','by','until','from … to'],items:[
["I've lived in this flat ___ 2019.","since"],
["Please send me your essay ___ Friday.","by","by = не пізніше ніж"],
["She fell asleep ___ the film.","during"],
["We waited for the bus ___ forty minutes.","for"],
["The library is open ___ 9 a.m. ___ 6 p.m.","from … to"],
["Don't start writing ___ I tell you.","until"]]},
{id:'e5',title:'Choose the correct answer (A–D) for each sentence in the pair.',note:'У кожному реченні пари інше слово.',type:'pair',items:[
[["My birthday is ___ June.","I've got a lesson ___ Tuesday afternoon."],["at","on","in","by"],["in","on"]],
[["There's a spider ___ the wall!","My brother is ___ university in Kharkiv."],["in","on","at","to"],["on","at"]],
[["I'll call you back ___ five minutes' time.","Grandpa always goes to bed early ___ night."],["on","at","in","for"],["in","at"]],
[["Get ___ the bus at the next stop.","Wait, let me get ___ of the car first."],["off","out","in","at"],["off","out"]],
[["Many shops are closed ___ Christmas Day.","Everyone gives presents ___ Christmas."],["in","at","on","for"],["on","at"]]]},
{id:'e6',title:'Read the text. For questions (1–10) choose the correct answer (A, B, C or D).',note:'Формат НМТ: A day in the city',type:'cloze',
text:"My cousin Olena came to visit me {1} last Saturday. Her train arrived {2} the station {3} half past nine {4} the morning. First, we had breakfast in a small café {5} the city centre. After that, we went to the history museum. {6} the top floor there was an amazing exhibition of old maps, and we stayed there {7} three hours! {8} lunchtime we sat {9} a bench in the park and ate sandwiches. Olena's train back left {10} time, and she promised to come again in the summer.",
items:[[["on","in","at","–"],"–"],[["in","to","at","on"],"at"],[["at","in","on","by"],"at"],[["on","at","in","for"],"in"],[["in","at","on","by"],"in"],
[["In","At","On","By"],"On"],[["since","during","for","in"],"for"],[["In","On","By","At"],"At"],[["in","at","on","by"],"on"],[["in","on","at","for"],"on"]]}
];
const L='ABCD';
const state={};   // key -> chosen value
const checked={}; // exId -> score
let TOTAL=0;
const KEY='prep-practice-v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(state,s.a||{});Object.assign(checked,s.c||{});}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:state,c:checked}))}catch(e){}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function gapsHTML(t,key){let i=0;return esc(t).replace(/___/g,()=>`<span class="gap" data-g="${key}" data-i="${i++}">&nbsp;</span>`)}
function optBtns(key,opts,letters){return `<div class="opts" data-k="${key}">`+opts.map((o,i)=>`<button type="button" data-v="${esc(o)}">${letters?`<span class="l">${L[i]}</span>`:''}${esc(o)}</button>`).join('')+'</div>'}
function answers(ex){ // list of [key, correct, why]
  if(ex.type==='gap'||ex.type==='fix') return ex.items.map((it,i)=>[`${ex.id}-${i}`,ex.type==='gap'?it[1]:it[2],ex.type==='gap'?it[2]:it[3]]);
  if(ex.type==='pair') return ex.items.flatMap((it,i)=>[[`${ex.id}-${i}-0`,it[2][0]],[`${ex.id}-${i}-1`,it[2][1]]]);
  return ex.items.map((it,i)=>[`${ex.id}-${i}`,it[1]]);
}
function render(){
  const app=document.getElementById('app');let h='';
  EX.forEach((ex,n)=>{
    h+=`<section id="${ex.id}"><div class="eh"><div class="num">${n+1}</div><h2>${esc(ex.title)}<small>${esc(ex.note)}</small></h2></div>`;
    if(ex.type==='gap') ex.items.forEach((it,i)=>{const k=`${ex.id}-${i}`;h+=`<div class="item"><div class="sent"><span class="n">${i+1}.</span>${gapsHTML(it[0],k)}</div>${optBtns(k,ex.opts)}<div class="fb" id="fb-${k}"></div></div>`});
    if(ex.type==='fix') ex.items.forEach((it,i)=>{const k=`${ex.id}-${i}`;h+=`<div class="item"><div class="sent"><span class="n">${i+1}.</span>${esc(it[0])}</div>${optBtns(k,it[1])}<div class="fb" id="fb-${k}"></div></div>`});
    if(ex.type==='pair') ex.items.forEach((it,i)=>{h+=`<div class="item"><div class="sent"><span class="n">${i+1}.</span></div>`;it[0].forEach((s,j)=>{const k=`${ex.id}-${i}-${j}`;h+=`<div class="sent" style="margin-top:6px">${gapsHTML(s,k)}</div>${optBtns(k,it[1],true)}<div class="fb" id="fb-${k}"></div>`});h+='</div>'});
    if(ex.type==='cloze'){
      h+=`<div class="text">${esc(ex.text).replace(/\{(\d+)\}/g,(m,d)=>`<span style="white-space:nowrap"><sup>${d}</sup><span class="gap" data-g="${ex.id}-${d-1}" data-i="0">&nbsp;</span></span>`)}</div>`;
      ex.items.forEach((it,i)=>{const k=`${ex.id}-${i}`;h+=`<div class="item"><div class="crow"><span class="n">${i+1}.</span>${optBtns(k,it[0],true)}</div><div class="fb" id="fb-${k}"></div></div>`});
    }
    h+=`<div class="actions"><button class="btn" data-check="${ex.id}">Перевірити</button><button class="btn ghost" data-reset="${ex.id}">Скинути</button><span class="score" id="sc-${ex.id}"></span></div></section>`;
    TOTAL+=answers(ex).length;
  });
  app.innerHTML=h;
  document.getElementById('total').textContent=TOTAL;
  document.getElementById('nav').innerHTML=EX.map((e,i)=>`<a href="#${e.id}" id="nv-${e.id}">Вправа ${i+1}</a>`).join('');
}
function fillGaps(k,v){
  const gs=document.querySelectorAll(`.gap[data-g="${k}"]`);
  const parts=v?(v.includes(' … ')?v.split(' … '):[v]):[];
  gs.forEach((g,i)=>{g.textContent=parts.length?(parts[i]??parts[0]):'\u00a0'});
}
function paint(k){
  const box=document.querySelector(`.opts[data-k="${k}"]`);if(!box)return;
  box.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v===state[k]));
  fillGaps(k,state[k]);
}
function exOf(k){return EX.find(e=>k.startsWith(e.id+'-'))}
function progress(){
  const n=Object.keys(state).filter(k=>state[k]).length;
  document.getElementById('answered').textContent=n;
  document.getElementById('prog').style.width=(n/TOTAL*100)+'%';
  const done=EX.filter(e=>checked[e.id]!==undefined);
  if(done.length){const s=done.reduce((a,e)=>a+checked[e.id],0),t=done.reduce((a,e)=>a+answers(e).length,0);document.getElementById('tot').innerHTML=`Правильно: <b>${s}</b> з <b>${t}</b>`}else document.getElementById('tot').textContent='';
  EX.forEach(e=>document.getElementById('nv-'+e.id).classList.toggle('done',checked[e.id]!==undefined));
  const f=document.getElementById('fscore'),m=document.getElementById('fmsg');
  if(done.length===EX.length){const s=done.reduce((a,e)=>a+checked[e.id],0);const p=Math.round(s/TOTAL*100);f.textContent=`${s} / ${TOTAL}`;
    m.textContent=p>=90?'Чудово! Прийменники під контролем.':p>=70?'Добре! Переглянь помилки й спробуй ще раз.':'Повтори шпаргалку at / on / in і пройди вправи ще раз.';}
  else{f.textContent='–';m.textContent='Перевір усі вправи, щоб побачити результат.';}
}
function check(id){
  const ex=EX.find(e=>e.id===id);let s=0;
  answers(ex).forEach(([k,right,why])=>{
    const v=state[k],ok=v===right;if(ok)s++;
    const box=document.querySelector(`.opts[data-k="${k}"]`);
    box.querySelectorAll('button').forEach(b=>{b.disabled=true;b.classList.remove('sel');
      if(b.dataset.v===right)b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');});
    document.querySelectorAll(`.gap[data-g="${k}"]`).forEach(g=>{g.classList.toggle('ok',ok);g.classList.toggle('bad',!ok)});
    const fb=document.getElementById('fb-'+k);
    fb.className='fb show '+(ok?'ok':'bad');
    fb.textContent=ok?('✓ Правильно'+(why?`. ${why}`:'')):(`✗ Правильна відповідь: ${right}`+(why?`. ${why}`:''));
  });
  checked[id]=s;document.getElementById('sc-'+id).textContent=`${s} / ${answers(ex).length}`;
  document.querySelector(`[data-check="${id}"]`).disabled=true;
  save();progress();
}
function reset(id){
  const ex=EX.find(e=>e.id===id);
  answers(ex).forEach(([k])=>{delete state[k];
    const box=document.querySelector(`.opts[data-k="${k}"]`);
    box.querySelectorAll('button').forEach(b=>{b.disabled=false;b.className=''});
    document.querySelectorAll(`.gap[data-g="${k}"]`).forEach(g=>g.classList.remove('ok','bad'));
    const fb=document.getElementById('fb-'+k);fb.className='fb';fb.textContent='';paint(k);});
  delete checked[id];document.getElementById('sc-'+id).textContent='';
  document.querySelector(`[data-check="${id}"]`).disabled=false;save();progress();
}
render();
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('.opts button');
  if(b&&!b.disabled){const k=b.parentElement.dataset.k;state[k]=state[k]===b.dataset.v?undefined:b.dataset.v;if(!state[k])delete state[k];paint(k);save();progress();return}
  const c=e.target.closest('[data-check]');if(c){check(c.dataset.check);return}
  const r=e.target.closest('[data-reset]');if(r)reset(r.dataset.reset);
});
document.getElementById('resetAll').addEventListener('click',()=>{EX.forEach(e=>reset(e.id));window.scrollTo({top:0,behavior:'smooth'})});
Object.keys(state).forEach(paint);
EX.forEach(e=>{if(checked[e.id]!==undefined)check(e.id)});
progress();
</script>
</body>
</html>
