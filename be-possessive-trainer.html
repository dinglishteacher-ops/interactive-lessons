  {ua:"Машина моїх батьків нова.", a:"My parents' car is new.", re:"my parents' car is new", why:"Множина на -s → parents'. І не забудь is."},
  {ua:"Як звати твою сестру?", a:"What is your sister's name?", re:"(what is|what's) your sister's name", why:"Дослівно: яке ім'я твоєї сестри?"},
  {ua:"Ми не втомлені.", a:"We aren't tired.", re:"(we are not|we aren't|we're not) tired", why:"we + are + not"},
  {ua:"Дах будинку червоний.", a:"The roof of the house is red.", re:"the roof of the house is red", why:"Річ → of. І не забудь is."},
  {ua:"Де ключі Анни?", a:"Where are Anna's keys?", re:"where are ann(a)?'s keys", why:"keys (багато) → are; Анни → Anna's"},
  {ua:"Мама Олега лікар.", a:"Oleh's mum is a doctor.", re:"ole[hg]'s (mum|mom|mother) is a doctor", why:"Oleh's mum + is + a doctor"},
  {ua:"Іграшки дітей на підлозі.", a:"The children's toys are on the floor.", re:"(the )?(children's|kids') toys are on the floor", why:"children's toys + are"},
  {ua:"Кінець фільму сумний.", a:"The end of the film is sad.", re:"the (end|ending) of the (film|movie) is sad", why:"Річ → of"},
  {ua:"Собака мого друга великий.", a:"My friend's dog is big.", re:"my friend's dog is big", why:"my friend's dog + is"},
  {ua:"Ці студенти з Києва?", a:"Are these students from Kyiv?", re:"are these students from k(yiv|iev)", why:"Питання: Are на початок."}
]}
];

function norm(s){
  return String(s).toLowerCase().replace(/[\u2019\u2018`\u02BC\u00B4]/g,"'").replace(/[.,!?;:"]/g," ").replace(/\s+/g," ").trim();
}
function matches(item, val){ return new RegExp("^(" + item.re + ")$").test(norm(val)); }

if (typeof module !== "undefined") { module.exports = {EX:EX, norm:norm, matches:matches}; }

if (typeof document !== "undefined") (function(){
  var KEY = "dinglish-be-poss-v1";
  var app = document.getElementById("app");
  var store = {best:{}, name:""};
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.best) store = p; } } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

  var st = null;        // running exercise state
  var copyText = "";

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function byId(id){ for (var i=0;i<EX.length;i++) if (EX[i].id===id) return EX[i]; }
  function fill(s, a){
    var parts = s.split("___");
    if (parts.length < 2) return null;
    var before = parts[0];
    if (a && a.charAt(0) === "'") before = before.replace(/\s$/,"");
    return [before, parts[1]];
  }

  /* ---------- home ---------- */
  function home(){
    st = null;
    var done = 0, html = "";
    html += '<header class="top"><span class="brand">dinglish</span></header>';
    html += '<p class="demo" aria-hidden="true">I <span class="gap">am</span> Anna<span class="gap">\'s</span> teacher.</p>';
    html += '<h1>am / is / are and \'s / of</h1>';
    html += '<p class="lede">Eight short exercises for elementary level. Tap or type your answer and see right away if it is correct.</p>';
    var part = "";
    EX.forEach(function(ex, i){
      if (ex.part !== part){ if (part) html += "</ol>"; part = ex.part; html += "<h2>" + esc(part) + '</h2><ol class="list">'; }
      var b = store.best[ex.id];
      if (b) done++;
      html += '<li><button class="row' + (b ? " done" : "") + '" data-start="' + ex.id + '">' +
        '<span class="n">' + (i+1) + '</span>' +
        '<span><span class="t">' + esc(ex.title) + '</span><span class="k">' + ex.items.length + " sentences, " + ex.how + '</span></span>' +
        '<span class="s">' + (b ? b.score + " / " + b.total : "Start") + '</span></button></li>';
    });
    html += "</ol>";
    html += '<section class="send"><label for="nm">Send your results to your teacher</label>' +
      '<div class="line"><input class="field" id="nm" placeholder="Your name" autocomplete="off" value="' + esc(store.name || "") + '">' +
      '<button class="btn" id="copy">Copy results</button></div>' +
      '<div id="copyout"></div>' +
      '<p class="note">' + done + " of " + EX.length + ' exercises done. Your best score is saved on this device. <button class="link" id="reset">Clear my results</button></p></section>';
    app.innerHTML = html;
    window.scrollTo(0,0);
  }

  function resultsText(){
    var lines = ["dinglish trainer: am / is / are + 's / of", "Student: " + (store.name || "-")];
    var s = 0, t = 0;
    EX.forEach(function(ex, i){
      var b = store.best[ex.id];
      lines.push((i+1) + ". " + ex.title + ": " + (b ? b.score + "/" + b.total : "not done"));
      if (b){ s += b.score; t += b.total; }
    });
    lines.push("Total: " + s + "/" + t);
    return lines.join("\n");
  }

  /* ---------- exercise ---------- */
  function start(id, subset){
    var ex = byId(id);
    var idx = subset || ex.items.map(function(_, i){ return i; });
    if (!ex.keep) idx = shuffle(idx);
    st = {ex:ex, queue:idx, pos:0, res:[], wrong:[], full:!subset, done:false};
    enter();
  }
  function enter(){
    var it = st.ex.items[st.queue[st.pos]];
    st.answered = false; st.ok = null; st.pick = null; st.attempt = 0; st.val = ""; st.hint = false; st.built = [];
    st.opts = it.o ? shuffle(it.o) : st.ex.options;
    if (st.ex.kind === "build"){
      var ord = it.w.map(function(_, i){ return i; }), tries = 0;
      do { ord = shuffle(ord); tries++; } while (tries < 20 && ord.every(function(v, i){ return v === i; }));
      st.order = ord;
    }
    draw(true);
  }
  function settle(ok){
    st.answered = true; st.ok = ok;
    st.res[st.pos] = ok ? "ok" : "bad";
    if (!ok) st.wrong.push(st.queue[st.pos]);
  }

  function answerHTML(ex, it){
    if (ex.kind === "build") return esc(cap(it.w.join(" ")) + it.end);
    if (ex.kind === "type") return esc(it.a);
    var f = fill(it.s, it.a);
    if (f) return esc(f[0]) + "<b>" + esc(it.a) + "</b>" + esc(f[1]);
    return esc(it.s).replace(/\[(.+?)\]/, "<b>$1</b>") + " (" + esc(it.a) + ")";
  }

  function draw(fresh){
    var ex = st.ex, it = ex.items[st.queue[st.pos]], n = st.queue.length, h = "";
    h += '<header class="top"><button class="link" data-home>All exercises</button><span class="count">' + (st.pos+1) + " / " + n + "</span></header>";
    h += '<h1 class="extitle">' + esc(ex.title) + "</h1>";
    h += '<p class="instr">' + esc(ex.instr) + "</p>";
    h += '<details class="rule"><summary>Правило</summary>' + ex.rule + "</details>";
    h += '<div class="bar" aria-hidden="true">';
    for (var i=0;i<n;i++) h += '<i class="' + (st.res[i] || (i===st.pos ? "now" : "")) + '"></i>';
    h += "</div>";
    h += '<div class="card">';

    if (ex.kind === "tap"){
      if (it.c) h += '<p class="ctx">' + esc(it.c) + "</p>";
      var f = fill(it.s, st.answered ? it.a : "");
      if (f){
        h += '<p class="sent">' + esc(f[0]) + '<span class="gap' + (st.answered ? " pop" : "") + '">' + (st.answered ? esc(it.a) : "&nbsp;") + "</span>" + esc(f[1]) + "</p>";
      } else {
        h += '<p class="sent">' + esc(it.s).replace(/\[(.+?)\]/, '<span class="gap">$1</span>') + "</p>";
      }
      h += '<div class="opts" style="--cols:' + (ex.cols || 3) + '">';
      st.opts.forEach(function(o, k){
        var c = "";
        if (st.answered){ if (o === it.a) c = " right"; else if (o === st.pick) c = " wrong"; }
        h += '<button class="opt' + c + '" data-opt="' + k + '"' + (st.answered ? " disabled" : "") + ">" + esc(o) + "</button>";
      });
      h += "</div>";
    }

    if (ex.kind === "type"){
      if (it.ua) h += '<p class="ua">' + esc(it.ua) + "</p>";
      else h += '<div class="pair"><span>' + esc(it.thing) + "</span><b>+</b><span>" + esc(it.owner) + "</span></div>";
      h += '<div class="typed"><input class="field" id="inp" aria-label="Your answer" placeholder="Type here" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' + (st.answered ? " disabled" : "") + ">" +
           (st.answered ? "" : '<button class="btn" data-check>Check answer</button>') + "</div>";
    }

    if (ex.kind === "build"){
      h += '<div class="built" aria-label="Your sentence">';
      st.built.forEach(function(wi, k){
        h += '<button class="tile" data-back="' + k + '"' + (st.answered ? " disabled" : "") + ">" + esc(k === 0 ? cap(it.w[wi]) : it.w[wi]) + "</button>";
      });
      h += '<span class="end">' + esc(it.end) + "</span></div>";
      h += '<div class="pool">';
      st.order.forEach(function(wi){
        if (st.built.indexOf(wi) < 0) h += '<button class="tile" data-word="' + wi + '">' + esc(it.w[wi]) + "</button>";
      });
      h += "</div>";
      if (!st.answered) h += '<div class="actions"><button class="btn" data-check' + (st.built.length === it.w.length ? "" : " disabled") + ">Check answer</button></div>";
    }

    if (st.hint && !st.answered) h += '<div class="fb hint" role="status">Not yet. Try once more. ' + esc(it.why || "") + "</div>";
    if (st.answered){
      if (st.ok) h += '<div class="fb ok" role="status"><b>Correct.</b> ' + (ex.kind === "tap" ? esc(it.why || "") : answerHTML(ex, it)) + "</div>";
      else h += '<div class="fb bad" role="status"><b>Not quite.</b> ' + (ex.kind === "tap" ? esc(it.why || "") : "Correct answer: " + answerHTML(ex, it) + ". " + esc(it.why || "")) + "</div>";
      h += '<div class="actions"><button class="btn" id="next" data-next>' + (st.pos + 1 < n ? "Next sentence" : "See my result") + "</button></div>";
    }
    h += "</div>";
    var open = app.querySelector("details.rule");
    var wasOpen = open && open.open && !fresh;
    app.innerHTML = h;
    if (wasOpen) app.querySelector("details.rule").open = true;

    var inp = document.getElementById("inp");
    if (inp){ inp.value = st.val; if (!st.answered){ inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){} } }
    var nx = document.getElementById("next");
    if (nx) nx.focus();
    if (fresh) window.scrollTo(0,0);
  }

  function choose(k){
    if (!st || st.done || st.answered || st.ex.kind !== "tap") return;
    var it = st.ex.items[st.queue[st.pos]], o = st.opts[k];
    if (o === undefined) return;
    st.pick = o; settle(o === it.a); draw();
  }
  function check(){
    if (!st || st.answered) return;
    var ex = st.ex, it = ex.items[st.queue[st.pos]], ok;
    if (ex.kind === "type"){
      var inp = document.getElementById("inp");
      st.val = inp ? inp.value : "";
      if (!norm(st.val)) { if (inp) inp.focus(); return; }
      ok = matches(it, st.val);
    } else {
      if (st.built.length !== it.w.length) return;
      ok = st.built.map(function(i){ return it.w[i]; }).join(" ") === it.w.join(" ");
    }
    if (ok){
      st.res[st.pos] = st.attempt === 0 ? "ok" : "bad";
      if (st.attempt > 0) st.wrong.push(st.queue[st.pos]);
      st.answered = true; st.ok = true;
    } else if (st.attempt === 0){
      st.attempt = 1; st.hint = true;
    } else {
      settle(false);
    }
    draw();
  }
  function next(){
    if (!st || !st.answered) return;
    if (st.pos + 1 < st.queue.length){ st.pos++; enter(); } else finish();
  }

  function finish(){
    var ex = st.ex, n = st.queue.length;
    var score = st.res.filter(function(r){ return r === "ok"; }).length;
    st.done = true;
    if (st.full){
      var b = store.best[ex.id];
      if (!b || score > b.score) store.best[ex.id] = {score:score, total:n};
      save();
    }
    var i = EX.indexOf(ex), nextEx = EX[i+1];
    var msg = score === n ? "Everything is correct." : score / n >= 0.7 ? "Good work. Look at your mistakes below." : "Read the rule again, then practise your mistakes.";
    var h = '<header class="top"><button class="link" data-home>All exercises</button></header>';
    h += '<h1 class="extitle">' + esc(ex.title) + "</h1>";
    h += '<p class="score">' + score + "<small> / " + n + "</small></p><p>" + msg + "</p>";
    if (st.wrong.length){
      h += '<ul class="review">';
      st.wrong.forEach(function(ix){ h += "<li>" + answerHTML(ex, ex.items[ix]) + "</li>"; });
      h += "</ul>";
    }
    h += '<div class="actions">';
    if (st.wrong.length) h += '<button class="btn" data-redo>Practise my mistakes</button>';
    if (nextEx) h += '<button class="btn' + (st.wrong.length ? " ghost" : "") + '" data-start="' + nextEx.id + '">Next exercise</button>';
    h += '<button class="btn ghost" data-start="' + ex.id + '">Do it again</button></div>';
    if (ex.speak && st.full) h += '<div class="speak"><b>Speaking</b>' + esc(ex.speak) + "</div>";
    app.innerHTML = h;
    window.scrollTo(0,0);
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (!t) return;
    var d = t.dataset;
    if (d.start) return start(d.start);
    if ("home" in d) return home();
    if (d.opt !== undefined) return choose(+d.opt);
    if ("check" in d) return check();
    if ("next" in d) return next();
    if ("redo" in d) return start(st.ex.id, st.wrong.slice());
    if (d.word !== undefined){ st.built.push(+d.word); st.hint = false; return draw(); }
    if (d.back !== undefined){ st.built.splice(+d.back, 1); st.hint = false; return draw(); }
    if (t.id === "copy"){
      copyText = resultsText();
      var out = document.getElementById("copyout");
      var show = function(note){
        out.innerHTML = '<textarea class="field" readonly aria-label="Your results"></textarea><p class="note">' + note + "</p>";
        var ta = out.querySelector("textarea"); ta.value = copyText; ta.focus(); ta.select();
      };
      try {
        navigator.clipboard.writeText(copyText).then(function(){ show("Results copied. Paste them in a message to your teacher."); },
                                                    function(){ show("Select the text, copy it and send it to your teacher."); });
      } catch(err){ show("Select the text, copy it and send it to your teacher."); }
      return;
    }
    if (t.id === "reset"){
      if (window.confirm("Clear all your results on this device?")){ store.best = {}; save(); home(); }
    }
  });
  app.addEventListener("input", function(e){
    if (e.target.id === "nm"){ store.name = e.target.value.trim(); save(); }
    if (e.target.id === "inp" && st){ st.val = e.target.value; }
  });
  document.addEventListener("keydown", function(e){
    if (!st || st.done) return;
    var inField = e.target && e.target.tagName === "INPUT";
    if (e.key === "Enter" && inField && e.target.id === "inp"){ e.preventDefault(); check(); return; }
    if (!inField && !e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)) choose(+e.key - 1);
  });

  home();
})();
</script>
</body>
</html>
