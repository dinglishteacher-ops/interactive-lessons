<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажер слів · dinglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DDE5DE;
    --paper:#FFFFFF;
    --ink:#13251D;
    --soft:#5A6C62;
    --line:#C3D0C5;
    --pine:#0F5C4A;
    --pine-dark:#0A4034;
    --gold:#C99700;
    --red:#A62B22;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:400 16px/1.5 "Manrope",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 16px 40px;
  }
  .app{width:100%;max-width:680px}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:3px}
  .mark{font:700 13px/1 "Unbounded",sans-serif;color:var(--pine);letter-spacing:.04em}
  h1{font:700 20px/1.2 "Unbounded",sans-serif;margin:0;letter-spacing:-.01em}
  .deck-meta{font-size:13px;color:var(--soft)}
  .sign{font:500 11px/1 "Unbounded",sans-serif;color:var(--soft);letter-spacing:.04em}

  /* ---------- card box tabs ---------- */
  .tabs{display:flex;gap:2px;align-items:flex-end;margin-bottom:0}
  .tab{
    font:500 13px/1 "Manrope",sans-serif;
    background:#CBD8CD;color:var(--soft);
    border:none;border-radius:5px 5px 0 0;
    padding:9px 12px 10px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .tab:hover{background:#D6E1D8}
  .tab[aria-selected="true"]{background:var(--paper);color:var(--pine);font-weight:700;padding-bottom:12px}

  .panel{
    background:var(--paper);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:18px 18px 20px;
    box-shadow:0 1px 0 rgba(19,37,29,.12);
  }

  /* ---------- controls ---------- */
  .controls{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .group{display:flex;flex-direction:column;gap:6px}
  .group > span{font-size:12px;color:var(--soft)}
  .seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .seg button{
    font:500 13px/1 "Manrope",sans-serif;background:var(--paper);color:var(--soft);
    border:none;border-right:1px solid var(--line);padding:8px 11px;cursor:pointer;
  }
  .seg button:last-child{border-right:none}
  .seg button:hover{background:#F0F4F0}
  .seg button[aria-pressed="true"]{background:var(--pine);color:#fff}

  /* ---------- progress ---------- */
  .progress{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
  .bar{flex:1;height:8px;border-radius:4px;background:#E4EAE5;display:flex;overflow:hidden}
  .bar i{display:block;height:100%;transition:width .3s}
  .b1{background:#E0C97A}.b2{background:#7FAE9B}.b3{background:var(--pine)}
  .counts{font-size:12px;color:var(--soft);white-space:nowrap}

  /* ---------- question card ---------- */
  .stage{margin-top:16px;min-height:330px;display:flex;flex-direction:column}
  .prompt-label{font-size:12px;color:var(--soft);margin-bottom:8px}
  .term{font:600 clamp(26px,6vw,40px)/1.15 "Unbounded",sans-serif;letter-spacing:-.02em;word-break:break-word}
  .term.ua{font-family:"Manrope",sans-serif;font-weight:700;font-size:clamp(22px,5vw,32px);line-height:1.25}
  .term-row{display:flex;align-items:flex-start;gap:10px}

  .options{display:flex;flex-direction:column;gap:8px;margin-top:22px}
  .opt{
    display:flex;gap:10px;align-items:flex-start;text-align:left;
    font:500 15px/1.35 "Manrope",sans-serif;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:5px;
    padding:12px 13px;cursor:pointer;transition:border-color .12s,background .12s;
  }
  .opt:hover:not(:disabled){border-color:var(--pine);background:#F4F8F5}
  .opt:disabled{cursor:default}
  .opt .key{font-size:12px;color:var(--soft);flex:0 0 14px;padding-top:2px}
  .opt.right{border-color:var(--pine);background:#EAF3EE;color:var(--pine-dark);font-weight:700}
  .opt.wrong{border-color:var(--red);background:#FBEDEC;color:var(--red)}

  .answer-area{margin-top:22px;display:flex;gap:8px}
  input[type=text]{
    flex:1;font:500 17px/1 "Manrope",sans-serif;color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:13px 14px;background:var(--paper);
  }
  input[type=text]:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}

  .btn{
    font:700 14px/1 "Manrope",sans-serif;background:var(--pine);color:#fff;
    border:none;border-radius:5px;padding:13px 18px;cursor:pointer;
  }
  .btn:hover{background:var(--pine-dark)}
  .btn.ghost{background:var(--paper);color:var(--pine);border:1px solid var(--pine)}
  .btn.ghost:hover{background:#EAF3EE}
  .btn.quiet{background:none;color:var(--soft);border:1px solid var(--line);font-weight:500}
  .btn.quiet:hover{background:#F0F4F0;color:var(--ink)}

  .feedback{margin-top:16px;font-size:15px;min-height:24px}
  .feedback b{font-weight:700}
  .feedback.ok{color:var(--pine-dark)}
  .feedback.no{color:var(--red)}
  .feedback .en{font-family:"Unbounded",sans-serif;font-weight:500}

  .flip-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;
    min-height:190px;display:flex;flex-direction:column;justify-content:center;
    cursor:pointer;background:#FCFDFC;
  }
  .flip-card .back{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:19px;font-weight:700}
  .flip-hint{font-size:12px;color:var(--soft);margin-top:14px}

  .row-btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);flex-wrap:wrap}
  kbd{font:500 11px/1 "Manrope",sans-serif;border:1px solid var(--line);border-radius:3px;padding:3px 5px;background:#F4F8F5}

  /* ---------- results ---------- */
  .done h2{font:700 22px/1.2 "Unbounded",sans-serif;margin:0 0 6px}
  .stat-line{font-size:15px;color:var(--soft);margin-bottom:18px}
  .hard-list{list-style:none;margin:0 0 20px;padding:0;border-top:1px solid var(--line)}
  .hard-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .hard-list .w{font-family:"Unbounded",sans-serif;font-weight:500;font-size:14px}
  .hard-list .t{color:var(--soft);text-align:right}

  @media (max-width:520px){
    .controls{gap:12px}
    .stage{min-height:300px}
    .panel{padding:14px 14px 16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">dinglish</span>
      <h1>Тренажер слів</h1>
    </div>
    <div class="deck-meta" id="deckMeta"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="panel">
    <div class="controls">
      <div class="group">
        <span>Режим</span>
        <div class="seg" id="modeSeg">
          <button data-mode="choice" aria-pressed="true">Вибір</button>
          <button data-mode="type" aria-pressed="false">Написання</button>
          <button data-mode="flash" aria-pressed="false">Картки</button>
        </div>
      </div>
      <div class="group">
        <span>Напрямок</span>
        <div class="seg" id="dirSeg">
          <button data-dir="en-ua" aria-pressed="true">EN → UA</button>
          <button data-dir="ua-en" aria-pressed="false">UA → EN</button>
          <button data-dir="mix" aria-pressed="false">Змішано</button>
        </div>
      </div>
    </div>

    <div class="progress">
      <div class="bar" aria-hidden="true">
        <i class="b1" id="segNew"></i><i class="b2" id="segLearn"></i><i class="b3" id="segKnown"></i>
      </div>
      <div class="counts" id="counts"></div>
    </div>

    <div class="stage" id="stage" aria-live="polite"></div>

    <div class="foot">
      <div id="hotkeys"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="sign">dinglish</span>
        <button class="btn quiet" id="resetBtn">Почати набір заново</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- дані ---------------- */
const RAW = [
 [1,"escape","втікати"],
 [1,"concept","концепція, ідея"],
 [1,"embarrassment, shame","сором"],
 [1,"side effects","побічні ефекти"],
 [1,"keep sth in mind","мати на увазі, не забути"],
 [1,"to my mind","на мою думку"],
 [1,"never mind","не зважай, нічого страшного"],
 [1,"change someone's mind","змінити чиюсь думку"],
 [1,"come to my mind","спадати на думку"],
 [1,"unexpected","неочікуваний"],
 [1,"to intend (intention)","мати намір, намір"],
 [1,"awkward","ніяковий, незграбний, незручний (момент)"],
 [1,"harmful","шкідливий"],
 [1,"without a trace","безслідно"],
 [1,"steal – stole – stolen","красти",["steal","stole","stolen"]],

 [2,"quality","якість"],
 [2,"quantity","кількість"],
 [2,"habit","звичка"],
 [2,"importance, important","важливість, важливий"],
 [2,"associate with something","асоціювати з чимось"],
 [2,"report","доповідати, звітувати, повідомляти; звіт"],
 [2,"envy / envious","заздрість, заздрісний"],
 [2,"frustrated / disappointed","розчарований"],
 [2,"wonder","цікавитися, дивуватися"],
 [2,"wrong","неправильний, помилковий"],
 [2,"addiction","залежність, шкідлива звичка, схильність"],
 [2,"suffer from","страждати від (чогось)"],
 [2,"unable to","нездатний, не в змозі"],
 [2,"anxiety","тривога, неспокій"],
 [2,"respect","поважати"],
 [2,"get on well with somebody","добре ладити з кимось"],
 [2,"acquaintance","знайомий, знайома"],
 [2,"it doesn't matter","це не має значення"],
 [2,"conversation","розмова"],
 [2,"interact / interaction","взаємодіяти, взаємодія"],

 [3,"stand – stood – stood","стояти",["stand","stood"]],
 [3,"strength","сила, міцність"],
 [3,"strike fear into","наводити страх"],
 [3,"enemies","вороги"],
 [3,"evil","злий, зло"],
 [3,"invoke","викликати, закликати"],
 [3,"assistance","допомога"],
 [3,"sacrifice","жертвувати, жертва"],
 [3,"wise, wisdom","мудрий, мудрість"],
 [3,"victory","перемога"],
 [3,"fertility","родючість, плодючість"],
 [3,"grace","витонченість, грація"],
 [3,"compare, comparable / incomparable","порівнювати, порівняний / непорівнянний"],
 [3,"seek for, look for, search for","шукати"],
 [3,"intimidate","залякувати"],

 [4,"affordable","доступний, недорогий за ціною"],
 [4,"afford","дозволити собі (матеріально)"],
 [4,"garment","предмет одягу, одежина"],
 [4,"aspiration","прагнення, сильне бажання"],
 [4,"aspire","прагнути, бажати"],
 [4,"participant","учасник"],
 [4,"breed","порода (тварин), розводити, розмноження"],
 [4,"to attend, visit","відвідувати"],
 [4,"display","показувати, демонструвати"],
 [4,"lack of","нестача чогось"],
 [4,"hygiene","гігієна"],
 [4,"mention","згадувати, посилатися на"],
 [4,"publish","публікувати, видавати"],
 [4,"host","приймати гостей, ведучий"],
 [4,"disabled","з інвалідністю; вимкнений (про функцію)"]
];

const WORDS = RAW.map((r,i)=>({id:i,set:r[0],en:r[1],ua:r[2],extra:r[3]||[]}));

/* ---------------- перевірка відповіді ---------------- */
function norm(s){
  return s.toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/\bsomething\b/g,'sth')
    .replace(/\b(somebody|someone)\b/g,'sb')
    .replace(/[^a-z' ]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .replace(/^to /,'');
}
function accepts(w){
  const out=new Set();
  const parens=[...w.en.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]);
  const base=w.en.replace(/\([^)]*\)/g,' ');
  [base,...parens,...w.extra].forEach(p=>out.add(norm(p)));
  base.split(/[,/]|–/).forEach(p=>{const n=norm(p); if(n) out.add(n);});
  out.delete('');
  return [...out];
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

/* ---------------- стан ---------------- */
const KNOWN_AT = 3;               // 3 правильні поспіль → слово вивчене
let state = {set:1, mode:'choice', dir:'en-ua', deck:[], current:null, lastId:null, asked:0, right:0};

function buildDeck(){
  const pool = state.set==='all' ? WORDS : WORDS.filter(w=>w.set===state.set);
  state.deck = pool.map(w=>({w, box:0, misses:0}));
  state.current=null; state.lastId=null; state.asked=0; state.right=0;
  render();
}

function pickNext(){
  const live = state.deck.filter(c=>c.box<KNOWN_AT);
  if(!live.length) return null;
  let pool = live.length>1 ? live.filter(c=>c.w.id!==state.lastId) : live;
  const weighted=[];
  pool.forEach(c=>{const n=KNOWN_AT-c.box+c.misses; for(let i=0;i<n;i++) weighted.push(c);});
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function direction(){
  if(state.dir==='mix') return Math.random()<.5?'en-ua':'ua-en';
  return state.dir;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function grade(card, ok){
  state.asked++;
  if(ok){ card.box++; state.right++; }
  else { card.box=0; card.misses++; }
  state.lastId=card.w.id;
}

/* ---------------- рендер ---------------- */
const stage=document.getElementById('stage');
const tabsEl=document.getElementById('tabs');

function renderTabs(){
  const items=[1,2,3,4].map(n=>({v:n,label:'Набір '+n})).concat([{v:'all',label:'Усі 65'}]);
  tabsEl.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='tab'; b.textContent=it.label; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(state.set===it.v));
    b.onclick=()=>{ state.set=it.v; buildDeck(); };
    tabsEl.appendChild(b);
  });
}
function renderProgress(){
  const total=state.deck.length;
  const known=state.deck.filter(c=>c.box>=KNOWN_AT).length;
  const learning=state.deck.filter(c=>c.box>0&&c.box<KNOWN_AT).length;
  const fresh=total-known-learning;
  document.getElementById('segNew').style.width=(fresh/total*100)+'%';
  document.getElementById('segLearn').style.width=(learning/total*100)+'%';
  document.getElementById('segKnown').style.width=(known/total*100)+'%';
  document.getElementById('counts').textContent=`вивчено ${known} з ${total}`;
  document.getElementById('deckMeta').textContent=
    state.asked? `${state.right} правильних із ${state.asked}` : '65 слів · 4 набори';
}
function renderHotkeys(){
  const h=document.getElementById('hotkeys');
  if(state.mode==='choice') h.innerHTML='<kbd>1</kbd>–<kbd>4</kbd> відповідь · <kbd>Enter</kbd> далі';
  else if(state.mode==='type') h.innerHTML='<kbd>Enter</kbd> перевірити, тоді далі';
  else h.innerHTML='<kbd>Пробіл</kbd> перевернути · <kbd>1</kbd> не знаю · <kbd>2</kbd> знаю';
}

function render(){
  renderTabs(); renderProgress(); renderHotkeys();
  const card=pickNext();
  if(!card){ renderDone(); return; }
  state.current={card, dir:direction()};
  if(state.mode==='flash') renderFlash();
  else if(state.mode==='type') renderType();
  else renderChoice();
}

function termBlock(text,isEn){
  const wrap=document.createElement('div');
  wrap.className='term-row';
  const t=document.createElement('div');
  t.className='term'+(isEn?'':' ua'); t.textContent=text;
  wrap.appendChild(t);
  return wrap;
}
function label(txt){const d=document.createElement('div');d.className='prompt-label';d.textContent=txt;return d;}
function fb(){const d=document.createElement('div');d.className='feedback';d.id='fbk';return d;}

/* --- режим: вибір --- */
function renderChoice(){
  const {card,dir}=state.current, w=card.w;
  const enToUa = dir==='en-ua';
  stage.innerHTML='';
  stage.appendChild(label(enToUa?'Що це означає?':'Як це англійською?'));
  stage.appendChild(termBlock(enToUa?w.en:w.ua, enToUa));

  const others=shuffle(WORDS.filter(x=>x.id!==w.id && (state.set==='all'||x.set===w.set)))
    .slice(0, Math.max(0,3));
  const opts=shuffle([w,...others]);
  const box=document.createElement('div'); box.className='options';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button';
    b.innerHTML='<span class="key">'+(i+1)+'</span><span>'+ (enToUa?o.ua:o.en) +'</span>';
    b.onclick=()=>answerChoice(o.id===w.id, box, opts, w, enToUa);
    box.appendChild(b);
  });
  stage.appendChild(box);
  stage.appendChild(fb());
}
function answerChoice(ok, box, opts, w, enToUa){
  if(box.dataset.done) return;
  box.dataset.done='1';
  grade(state.current.card, ok);
  [...box.children].forEach((b,i)=>{
    b.disabled=true;
    if(opts[i].id===w.id) b.classList.add('right');
  });
  const f=document.getElementById('fbk');
  if(ok){ f.className='feedback ok'; f.textContent='Правильно'; }
  else{
    f.className='feedback no';
    f.innerHTML='Правильна відповідь: <b class="'+(enToUa?'':'en')+'">'+(enToUa?w.ua:w.en)+'</b>';
    [...box.children].forEach((b,i)=>{ if(opts[i].id!==w.id && b===document.activeElement) b.classList.add('wrong'); });
  }
  renderProgress();
  nextButton();
}

/* --- режим: написання --- */
function renderType(){
  const {card}=state.current, w=card.w;
  stage.innerHTML='';
  stage.appendChild(label('Напиши англійською'));
  stage.appendChild(termBlock(w.ua,false));
  const area=document.createElement('div'); area.className='answer-area';
  const inp=document.createElement('input');
  inp.type='text'; inp.id='typed'; inp.autocomplete='off'; inp.autocapitalize='off';
  inp.spellcheck=false; inp.placeholder='твоя відповідь';
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Перевірити';
  btn.onclick=()=>checkTyped();
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); checkTyped(); } };
  area.append(inp,btn); stage.appendChild(area);
  stage.appendChild(fb());
  inp.focus();
}
function checkTyped(){
  const inp=document.getElementById('typed');
  if(!inp || inp.disabled || !inp.value.trim()) return;
  const w=state.current.card.w;
  const list=accepts(w), val=norm(inp.value);
  const ok=list.includes(val);
  const close=!ok && list.some(a=>lev(a,val)<=2 && Math.abs(a.length-val.length)<=2);
  const f=document.getElementById('fbk');
  if(close){
    f.className='feedback no';
    f.textContent='Майже — перевір написання і спробуй ще раз';
    inp.select();
    return;
  }
  grade(state.current.card, ok);
  inp.disabled=true;
  f.className='feedback '+(ok?'ok':'no');
  f.innerHTML = ok ? 'Правильно' : 'Правильна відповідь: <b class="en">'+w.en+'</b>';
  renderProgress();
  nextButton();
}

/* --- режим: картки --- */
function renderFlash(){
  const {card,dir}=state.current, w=card.w;
  const enFront = dir!=='ua-en';
  stage.innerHTML='';
  const fc=document.createElement('div'); fc.className='flip-card'; fc.tabIndex=0;
  fc.appendChild(termBlock(enFront?w.en:w.ua, enFront));
  const hint=document.createElement('div'); hint.className='flip-hint'; hint.textContent='Натисни, щоб побачити переклад';
  fc.appendChild(hint);
  const reveal=()=>{
    if(fc.dataset.open) return;
    fc.dataset.open='1'; hint.remove();
    const back=document.createElement('div'); back.className='back';
    back.textContent = enFront ? w.ua : w.en;
    if(!enFront) back.style.fontFamily='"Unbounded",sans-serif';
    fc.appendChild(back);
    grades.style.display='flex';
  };
  fc.onclick=reveal;
  fc.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();} };
  stage.appendChild(fc);

  const grades=document.createElement('div');
  grades.className='row-btns'; grades.style.display='none';
  const no=document.createElement('button'); no.className='btn ghost'; no.textContent='Ще не знаю';
  const yes=document.createElement('button'); yes.className='btn'; yes.textContent='Знаю';
  no.onclick=()=>{grade(state.current.card,false);render();};
  yes.onclick=()=>{grade(state.current.card,true);render();};
  grades.append(no,yes); stage.appendChild(grades);
  fc.focus();
}

function nextButton(){
  const row=document.createElement('div'); row.className='row-btns';
  const b=document.createElement('button'); b.className='btn'; b.id='nextBtn'; b.textContent='Далі';
  b.onclick=()=>render();
  row.appendChild(b); stage.appendChild(row); b.focus();
}

/* --- підсумок --- */
function renderDone(){
  const total=state.deck.length;
  const hard=state.deck.filter(c=>c.misses>0).sort((a,b)=>b.misses-a.misses).slice(0,8);
  stage.innerHTML='';
  const d=document.createElement('div'); d.className='done';
  d.innerHTML='<h2>Набір пройдено</h2><div class="stat-line">'+total+
    ' слів вивчено · '+state.right+' правильних із '+state.asked+' відповідей</div>';
  if(hard.length){
    const h=document.createElement('div');
    h.style.cssText='font-size:13px;color:var(--soft);margin-bottom:6px';
    h.textContent='Ці слова давалися найважче — повтори їх завтра:';
    d.appendChild(h);
    const ul=document.createElement('ul'); ul.className='hard-list';
    hard.forEach(c=>{
      const li=document.createElement('li');
      li.innerHTML='<span class="w">'+c.w.en+'</span><span class="t">'+c.w.ua+'</span>';
      ul.appendChild(li);
    });
    d.appendChild(ul);
  }
  const row=document.createElement('div'); row.className='row-btns';
  const again=document.createElement('button'); again.className='btn'; again.textContent='Пройти цей набір ще раз';
  again.onclick=buildDeck;
  row.appendChild(again);
  if(state.set!=='all'){
    const next=document.createElement('button'); next.className='btn ghost';
    const n = state.set<4 ? state.set+1 : 'all';
    next.textContent = state.set<4 ? 'Перейти до набору '+n : 'Тренувати всі 65 слів';
    next.onclick=()=>{state.set=n;buildDeck();};
    row.appendChild(next);
  }
  d.appendChild(row);
  stage.appendChild(d);
  renderProgress();
}

/* ---------------- керування ---------------- */
document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.mode=b.dataset.mode;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
};
document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.dir=b.dataset.dir;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
};
document.getElementById('resetBtn').onclick=buildDeck;

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const nb=document.getElementById('nextBtn');
  if(e.key==='Enter' && nb){ e.preventDefault(); nb.click(); return; }
  if(state.mode==='choice' && /^[1-4]$/.test(e.key)){
    const opts=stage.querySelectorAll('.opt');
    const b=opts[+e.key-1]; if(b && !b.disabled){ b.focus(); b.click(); }
  }
  if(state.mode==='flash'){
    const fc=stage.querySelector('.flip-card');
    if(e.key===' ' && fc && !fc.dataset.open){ e.preventDefault(); fc.click(); }
    const btns=stage.querySelectorAll('.row-btns .btn');
    if(fc && fc.dataset.open && btns.length===2){
      if(e.key==='1') btns[0].click();
      if(e.key==='2') btns[1].click();
    }
  }
});

buildDeck();
</script>
</body>
</html>
